<!DOCTYPE html>
<html lang="en" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../src/output.css">
    <title>Document</title>
</head>

<body class="bg-zinc-800 text-white font-Dana">

    <svg class="hidden">
        <symbol id="person" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
            stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round"
                d="M17.982 18.725A7.488 7.488 0 0 0 12 15.75a7.488 7.488 0 0 0-5.982 2.975m11.963 0a9 9 0 1 0-11.963 0m11.963 0A8.966 8.966 0 0 1 12 21a8.966 8.966 0 0 1-5.982-2.275M15 9.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
        </symbol>

        <symbol id="camera" xmlns="http://www.w3.org/2000/svg" text-white" fill="none" viewBox="0 0 24 24"
            stroke="currentColor" stroke-width="2">

            <path stroke-linecap="round" stroke-linejoin="round"
                d="M3 8a2 2 0 012-2h2l1-2h8l1 2h2a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V8z" />

            <circle cx="12" cy="13" r="3" />

        </symbol>

        <symbol id="user" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
        </symbol>

        <symbol id="archive-box-arrow-down" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"">
            <path stroke-linecap="round" stroke-linejoin="round" d="m20.25 7.5-.625 10.632a2.25 2.25 0 0 1-2.247 2.118H6.622a2.25 2.25 0 0 1-2.247-2.118L3.75 7.5m8.25 3v6.75m0 0-3-3m3 3 3-3M3.375 7.5h17.25c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125Z" />
        </symbol>

        <symbol id="heart" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z" />
        </symbol>

        <symbol id="map-pin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z" />
        </symbol>

        <symbol id="lock-closed" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z" />
        </symbol>

        <symbol id="anglearrow-left-start-on-rectangle" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 9V5.25A2.25 2.25 0 0 1 10.5 3h6a2.25 2.25 0 0 1 2.25 2.25v13.5A2.25 2.25 0 0 1 16.5 21h-6a2.25 2.25 0 0 1-2.25-2.25V15m-3 0-3-3m0 0 3-3m-3 3H15" />
        </symbol>

    </svg>

    <!-- <header class="h-[150px]">

    </header> -->


    <main>
        <div class="max-w-4xl mx-auto min-h-screen px-4">
            <!-- top -->
            <div>
                <h1 class="text-2xl font-MorabbaBold mb-3">پروفایل کاربری</h1>
                <div class="font-Dana ">
                    <span>خانه</span>
                    <span>/</span>
                    <span class="text-emerald-600">پروفایل</span>
                </div>
            </div>

            <!-- main -->
            <div class="mt-8 flex gap-10">
                <!-- rigth -->
                <div class="w-full bg-zinc-700 text-white font-Dana p-10 rounded-xl">
                    <form action="#" class="">
                        <div class="relative w-32 h-32 mx-auto">
                            <img src="./images/profile.png" class="rounded-full object-cover w-full h-full border-4 bg-amber-50 border-zinc-700 shadow-lg" alt="">
                        </div>
                        <div class="mt-8 space-y-10">
                            <div class="w-full">
                                <label for="fullName" class="font-Dana text-xl">نام و نام خانوادگی</label>
                                <input id="fullName" type="text" name="fullName"
                                    class="mt-3 flex-center w-full h-12 px-2 border rounded-lg border-teal-600"
                                    placeholder="مهدی غریبی">
                            </div>
                            <div>
                                <label for="phoneNumber" class="font-Dana text-xl">شماره موبایل</label>
                                <input id="phoneNumber" type="tel" name="phoneNumber"
                                    class="mt-3 flex-center w-full h-12  px-2 border rounded-lg border-teal-600"
                                    placeholder="09123456789">
                            </div>
                            <div>
                                <label for="email" class="font-Dana text-xl">ایمیل</label>
                                <input id="email" type="email" name="email"
                                    class="mt-3 flex-center w-full h-12  px-2 border rounded-lg border-teal-600"
                                    placeholder="mahdionline@gmail.com">
                            </div>
                            <a class="flex-center bg-emerald-600 text-white font-Dana text-xl h-15 rounded-lg px-3 ">ذخیره
                                تغییرات</a>

                        </div>
                    </form>
                </div>
                <!-- left -->
                <div class=" text-white font-Dana text-lg p-5 w-[400px]">
                    <div class="dashboard">
                        <svg class="w-6 h-6">
                            <use href="#user"></use>
                        </svg>
                        <span>پروفایل</span>
                    </div>
                    <div class="dashboard">
                        <svg class="w-6 h-6">
                            <use href="#archive-box-arrow-down"></use>
                        </svg>
                        <span>سفارشات من</span>
                    </div>
                    <div class="dashboard">
                        <svg class="w-6 h-6">
                            <use href="#heart" ></use>
                        </svg>
                        <span>علاقه مندی ها</span>
                    </div>
                    <div class="dashboard">
                        <svg class="w-6 h-6">
                            <use href="#map-pin"></use>
                        </svg>
                        <span>آدرس ها</span>
                    </div>
                    <div class="dashboard">
                        <svg class="w-6 h-6">
                            <use href="#lock-closed"></use>
                        </svg>
                        <span>تغییر رمز عبور</span>
                    </div>
                    <div class="dashboard">
                        <svg class="w-6 h-6">
                            <use href="#anglearrow-left-start-on-rectangle"></use>
                        </svg>
                        <span>خروج</span>
                    </div>
                </div>

            </div>


        </div>
    </main>
</body>

</html>
